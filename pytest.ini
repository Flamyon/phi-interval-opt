# pytest configuration. the only entry is the slow marker, registered so that an
# unmarked name is an error rather than a warning: the tests that run a solver are
# marked slow, so the suite runs fast by default and in full before a commit.
#   python -m pytest -q -m "not slow"    the fast run
#   python -m pytest -q                  the full run, before every commit
[pytest]
markers =
    slow: runs nsga-ii or mopso, seconds rather than milliseconds
