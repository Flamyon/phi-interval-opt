# pytest configuration. the only entry is the slow marker, registered so that an
# unmarked name is an error rather than a warning: the tests that run a solver or
# a large sample are marked slow, so the suite runs fast by default and in full
# before a commit.
#   python -m pytest -q -m "not slow"    the fast run
#   python -m pytest -q                  the full run, before every commit
[pytest]
markers =
    slow: runs a solver, or a large-sample diagnostic rather than a correctness
        check, such as the fill-distance study the c3 tolerance is a quantile of,
        b2's dense-sample check, c3's shielded-tail rates and a5's separation
        report. seconds rather than milliseconds
